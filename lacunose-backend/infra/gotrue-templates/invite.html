<!doctype html>
<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #faf8f3; padding: 40px 20px; color: #1a1a1a;">
    <div style="max-width: 480px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 16px;">
      <h2 style="margin: 0 0 16px; font-size: 20px;">You've been invited to Lacunose</h2>
      <p style="margin: 0 0 24px; color: #555;">Open the Lacunose app and enter this code to accept your invitation:</p>
      <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; text-align: center; background: #f3efe6; padding: 20px; border-radius: 12px; margin: 0 0 24px; color: #1a1a1a; font-family: 'SF Mono', Menlo, monospace;">{{ .Token }}</p>
      <p style="margin: 0 0 8px; color: #888; font-size: 13px;">This code expires in 1 hour.</p>
    </div>
  </body>
</html>
