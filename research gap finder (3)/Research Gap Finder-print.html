<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Research Gap Finder — Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', system-ui, sans-serif; color: #0E0E0C; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  * { box-sizing: border-box; }
  em { font-style: italic; }

  .page {
    width: 297mm; height: 209mm;
    padding: 14mm;
    display: flex;
    background: #F1EEE8;
    break-after: page;
    page-break-after: always;
    overflow: hidden;
    position: relative;
  }
  .page:last-child { break-after: auto; page-break-after: auto; }

  .page-label {
    position: absolute; top: 10mm; left: 14mm;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 1.5px;
    color: rgba(14,14,12,0.45); text-transform: uppercase;
  }
  .page-num {
    position: absolute; bottom: 10mm; right: 14mm;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; color: rgba(14,14,12,0.45);
  }
  .brand {
    position: absolute; bottom: 10mm; left: 14mm;
    font-family: 'Instrument Serif', serif;
    font-size: 13px; color: rgba(14,14,12,0.6);
  }

  @page { size: A4 landscape; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .page { box-shadow: none; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel" src="components/logo.jsx"></script>
<script type="text/babel" src="components/screen-home.jsx"></script>
<script type="text/babel" src="components/screen-analyze.jsx"></script>
<script type="text/babel" src="components/screen-results.jsx"></script>
<script type="text/babel" src="components/screen-extras.jsx"></script>
<script type="text/babel" src="components/screen-auth.jsx"></script>
<script type="text/babel" src="components/logo-showcase.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// Frame for a single phone on a page
function PhoneFrame({ children, showNav = true, navActive = 'home' }) {
  return (
    <div style={{ width: 402, height: 874, borderRadius: 48, background: RGF.bg, overflow: 'hidden', position: 'relative',
      boxShadow: '0 40px 60px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.08)' }}>
      <div style={{ position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50 }} />
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={false} />
      </div>
      <div style={{ position: 'absolute', inset: 0 }}>{children}</div>
      {showNav && <FloatingNav active={navActive}/>}
      <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none' }}>
        <div style={{ width: 139, height: 5, borderRadius: 100, background: 'rgba(0,0,0,0.25)' }}/>
      </div>
    </div>
  );
}

// A landscape page: left text panel + right phone (scaled down to fit)
function PhonePage({ label, num, title, subtitle, notes = [], children, showNav = true, navActive = 'home' }) {
  return (
    <div className="page">
      <div className="page-label">{label}</div>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingRight: 30 }}>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 10, letterSpacing: 2, color: 'rgba(14,14,12,0.5)', textTransform: 'uppercase', marginBottom: 10 }}>{label}</div>
        <div style={{ fontFamily: RGF.display, fontSize: 52, lineHeight: 1, letterSpacing: -1.6, color: RGF.ink, marginBottom: 14, fontWeight: 400 }}>{title}</div>
        <div style={{ fontSize: 15, color: RGF.inkSoft, lineHeight: 1.55, marginBottom: 20, maxWidth: 440 }}>{subtitle}</div>
        <ul style={{ fontSize: 13, color: RGF.inkSoft, lineHeight: 1.65, paddingLeft: 18, margin: 0, maxWidth: 440 }}>
          {notes.map((n, i) => <li key={i} style={{ marginBottom: 4 }}>{n}</li>)}
        </ul>
      </div>
      <div style={{ width: 360, display: 'flex', justifyContent: 'center', alignItems: 'center', flexShrink: 0 }}>
        <div style={{ transform: 'scale(0.72)', transformOrigin: 'center' }}>
          <PhoneFrame showNav={showNav} navActive={navActive}>{children}</PhoneFrame>
        </div>
      </div>
      <div className="brand">Lacuna · Research Gap Finder</div>
      <div className="page-num">{num}</div>
    </div>
  );
}

function CoverPage() {
  return (
    <div className="page" style={{ flexDirection: 'column', justifyContent: 'center' }}>
      <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, letterSpacing: 2, color: 'rgba(14,14,12,0.5)', textTransform: 'uppercase', marginBottom: 16 }}>
        App design · April 2026
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 28, marginBottom: 24 }}>
        <Logo size={96}/>
        <div style={{ fontFamily: RGF.display, fontSize: 120, lineHeight: 0.9, letterSpacing: -4, color: RGF.ink, fontWeight: 400 }}>
          Lacuna<span style={{ fontStyle: 'italic' }}>.</span>
        </div>
      </div>
      <div style={{ fontSize: 20, color: RGF.inkSoft, lineHeight: 1.5, maxWidth: 640, marginBottom: 40 }}>
        A medical-literature gap-finder. 13 screens across onboarding, guided first exploration, and the core app.
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px 40px', maxWidth: 720 }}>
        {[
          ['01', 'Get started'],
          ['02–05', 'Onboarding — guided first exploration'],
          ['06', 'Sign up — Google / Apple / Email'],
          ['07', 'Sign in — email & social'],
          ['08', 'Home'],
          ['09', 'Analyze'],
          ['10', 'Streaming results'],
          ['11', 'Gap detail'],
          ['12', 'Library'],
          ['13', 'Paywall'],
        ].map(([n, t]) => (
          <div key={n} style={{ display: 'flex', gap: 14, fontSize: 14, color: RGF.inkSoft, borderTop: '1px solid rgba(0,0,0,0.08)', paddingTop: 8 }}>
            <span style={{ fontFamily: 'JetBrains Mono, monospace', color: 'rgba(14,14,12,0.45)', minWidth: 56 }}>{n}</span>
            <span>{t}</span>
          </div>
        ))}
      </div>
      <div className="brand">Lacuna · Research Gap Finder</div>
      <div className="page-num">cover</div>
    </div>
  );
}

function LogoPage() {
  return (
    <div className="page" style={{ flexDirection: 'column' }}>
      <div className="page-label">Brand · Logo</div>
      <div style={{ marginTop: 24, marginBottom: 18 }}>
        <div style={{ fontFamily: RGF.display, fontSize: 44, letterSpacing: -1.4, color: RGF.ink, lineHeight: 1, fontWeight: 400 }}>The <em>gap mark.</em></div>
        <div style={{ fontSize: 14, color: RGF.inkSoft, marginTop: 8, maxWidth: 720 }}>Two dashes with a focal dot — the lacuna between what's been said. Butter-yellow dot for warmth; black squircle container at 32% radius.</div>
      </div>
      <div style={{ display: 'flex', gap: 18, alignItems: 'center', marginBottom: 18, flex: 1 }}>
        <div style={{ background: '#fff', borderRadius: 24, padding: 22, border: '1px solid rgba(0,0,0,0.08)', flex: 1, display: 'flex', justifyContent: 'center', alignItems: 'center' }}>
          <Logo size={180}/>
        </div>
        <div style={{ flex: 1, display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12 }}>
          {['gap', 'bracket', 'ellipsis', 'aperture'].map(v => (
            <div key={v} style={{ background: '#fff', borderRadius: 16, padding: 14, border: '1px solid rgba(0,0,0,0.08)', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
              <Logo size={64} variant={v}/>
              <div style={{ fontSize: 11, color: RGF.muted, textTransform: 'capitalize' }}>{v}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ display: 'flex', gap: 14, alignItems: 'flex-end' }}>
        {[20, 28, 40, 56, 80, 112].map(s => (
          <div key={s} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
            <Logo size={s}/>
            <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 9, color: RGF.muted }}>{s}px</div>
          </div>
        ))}
        <div style={{ flex: 1 }}/>
        <div style={{ background: RGF.ink, borderRadius: 16, padding: '12px 18px', display: 'flex', gap: 14, alignItems: 'center' }}>
          <Logo size={36} bg="#fff" dash={RGF.ink} dot={RGF.butter}/>
          <div style={{ fontFamily: RGF.display, fontSize: 22, color: '#fff', letterSpacing: -0.4 }}>Lacuna<span style={{ fontStyle: 'italic' }}>.</span></div>
        </div>
      </div>
      <div className="brand">Lacuna · Research Gap Finder</div>
      <div className="page-num">brand</div>
    </div>
  );
}

function NamesPage() {
  const names = [
    { n: 'Lacuna', meaning: 'Latin for an unfilled space or gap.', tone: 'Scholarly', picked: true },
    { n: 'Null', meaning: 'The null result — what the field hasn\'t said.', tone: 'Sharp' },
    { n: 'Hypothes', meaning: 'From hypothesis — a stub pointing forward.', tone: 'Direct' },
    { n: 'Margin', meaning: 'Work happens in the margins of the literature.', tone: 'Warm' },
    { n: 'Unsaid', meaning: 'The papers haven\'t written it yet.', tone: 'Editorial' },
    { n: 'Aperture', meaning: 'Narrow to the open question.', tone: 'Optical' },
    { n: 'Penumbra', meaning: 'The half-lit edge of a field.', tone: 'Poetic' },
    { n: 'Sieve', meaning: 'Strain the literature for what falls through.', tone: 'Utilitarian' },
  ];
  return (
    <div className="page" style={{ flexDirection: 'column' }}>
      <div className="page-label">Naming · 8 candidates</div>
      <div style={{ marginTop: 24, marginBottom: 18 }}>
        <div style={{ fontFamily: RGF.display, fontSize: 44, letterSpacing: -1.4, color: RGF.ink, lineHeight: 1, fontWeight: 400 }}>Eight <em>candidates.</em></div>
        <div style={{ fontSize: 14, color: RGF.inkSoft, marginTop: 8, maxWidth: 720 }}>All short, all one clean concept. "Lacuna" is the current pick — a real scientific term for a missing piece in the evidence base.</div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, flex: 1 }}>
        {names.map(n => (
          <div key={n.n} style={{
            background: n.picked ? RGF.butter : '#fff',
            borderRadius: 18, padding: '14px 18px',
            border: n.picked ? '1.5px solid #0E0E0C' : '1px solid rgba(0,0,0,0.08)',
            display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
              <div style={{ fontFamily: RGF.display, fontSize: 28, letterSpacing: -0.8, color: RGF.ink, fontWeight: 400 }}>{n.n}<span style={{ fontStyle: 'italic' }}>.</span></div>
              <div style={{ fontSize: 9, color: RGF.muted, letterSpacing: 0.5, textTransform: 'uppercase' }}>{n.tone}</div>
            </div>
            <div style={{ fontSize: 11, color: RGF.inkSoft, lineHeight: 1.4 }}>{n.meaning}</div>
          </div>
        ))}
      </div>
      <div className="brand">Lacuna · Research Gap Finder</div>
      <div className="page-num">naming</div>
    </div>
  );
}

function SystemPage() {
  const swatches = [
    ['Sky', RGF.sky, 'future-work'],
    ['Mint', RGF.mint, 'methodology'],
    ['Lavender', RGF.lavender, 'PICO'],
    ['Butter', RGF.butter, 'AI synth'],
    ['Peach', RGF.peach, 'geography'],
    ['Rose', RGF.rose, 'population'],
  ];
  return (
    <div className="page" style={{ flexDirection: 'column' }}>
      <div className="page-label">System</div>
      <div style={{ marginTop: 24, marginBottom: 22 }}>
        <div style={{ fontFamily: RGF.display, fontSize: 44, letterSpacing: -1.4, color: RGF.ink, lineHeight: 1, fontWeight: 400 }}>One system, <em>six categories.</em></div>
      </div>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 10, letterSpacing: 1.5, color: RGF.muted, textTransform: 'uppercase', marginBottom: 10 }}>Type</div>
        <div style={{ display: 'flex', gap: 60 }}>
          <div>
            <div style={{ fontFamily: RGF.display, fontSize: 36, letterSpacing: -1, color: RGF.ink, lineHeight: 1 }}>Instrument <em>Serif</em></div>
            <div style={{ fontSize: 11, color: RGF.muted, marginTop: 4 }}>Display · Headlines · Evidence quotes</div>
          </div>
          <div>
            <div style={{ fontSize: 28, fontWeight: 600, letterSpacing: -0.6, color: RGF.ink, lineHeight: 1 }}>Inter</div>
            <div style={{ fontSize: 11, color: RGF.muted, marginTop: 4 }}>UI · Body · Labels (400–700)</div>
          </div>
        </div>
      </div>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 10, letterSpacing: 1.5, color: RGF.muted, textTransform: 'uppercase', marginBottom: 10 }}>Category palette</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 10 }}>
          {swatches.map(([name, c, use]) => (
            <div key={name}>
              <div style={{ background: c, height: 60, borderRadius: 14, marginBottom: 6 }}/>
              <div style={{ fontSize: 11, fontWeight: 600, color: RGF.ink }}>{name}</div>
              <div style={{ fontSize: 9, color: RGF.muted }}>{use}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 10, letterSpacing: 1.5, color: RGF.muted, textTransform: 'uppercase', marginBottom: 10 }}>Building blocks</div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center', marginBottom: 14 }}>
          <CategoryPill kind="future-work"/>
          <CategoryPill kind="methodology"/>
          <CategoryPill kind="pico"/>
          <CategoryPill kind="llm"/>
          <CategoryPill kind="geography"/>
        </div>
        <div style={{ display: 'flex', gap: 22, alignItems: 'center' }}>
          <ScoreDial value={9} label="Novelty"/>
          <ScoreDial value={7} label="Feasibility"/>
          <ScoreDial value={6} label="Evidence"/>
        </div>
      </div>
      <div className="brand">Lacuna · Research Gap Finder</div>
      <div className="page-num">system</div>
    </div>
  );
}

function App() {
  return (
    <>
      <CoverPage/>
      <LogoPage/>
      <NamesPage/>
      <PhonePage label="01 · Get started" num="01"
        title="Get started."
        subtitle="Single-CTA entry point. Ambient color blobs echo the category palette."
        notes={['Logo top-left', 'Hero serif headline (4 lines)', 'Single centered "Get started" button', 'Subtle sign-in link below']}
        showNav={false}><ScreenGetStarted appName="Lacuna"/></PhonePage>

      <PhonePage label="02 · Onboarding · pick topic" num="02"
        title="Pick a topic."
        subtitle="Step 1 of 4. User taps a suggested seed topic."
        notes={['Progress dots at top', 'Selected card gets colored fill + black border', 'Check badge on the right']}
        showNav={false}><ScreenOnboardA/></PhonePage>

      <PhonePage label="03 · Onboarding · PICO" num="03"
        title="Frame the question."
        subtitle="Step 2 of 4. Teaches PICO structure via pre-filled rows."
        notes={['P / I / C / O rows with category colors', 'Auto-filled hint at the bottom', 'Tap any row to edit']}
        showNav={false}><ScreenOnboardB/></PhonePage>

      <PhonePage label="04 · Onboarding · analysis" num="04"
        title="Reading for you."
        subtitle="Step 3 of 4. Live progress + terminal log."
        notes={['Large percent readout', 'Terminal-style log in ink', 'Spinner + progress bar']}
        showNav={false}><ScreenOnboardC/></PhonePage>

      <PhonePage label="05 · Onboarding · reveal gate" num="05"
        title="Reveal gate."
        subtitle="Step 4 of 4. User sees gap #1 half-revealed, with 7 more blurred."
        notes={['Title partially blurred', 'Novelty shown, feasibility locked', 'Stack of blurred gaps behind sign-up card']}
        showNav={false}><ScreenOnboardReveal/></PhonePage>

      <PhonePage label="06 · Sign up" num="06"
        title="Create account."
        subtitle="Three big buttons: Google, Apple, Email."
        notes={['Google button with branded colors', 'Apple button in solid ink', 'Email as outlined alternative']}
        showNav={false}><ScreenSignUp/></PhonePage>

      <PhonePage label="07 · Sign in" num="07"
        title="Welcome back."
        subtitle="Email + password, forgot-password link, social fallback."
        notes={['Email + password fields', 'Show / Forgot inline controls', 'Google + Apple split below divider']}
        showNav={false}><ScreenSignIn/></PhonePage>

      <PhonePage label="08 · Home" num="08"
        title="Home."
        subtitle="Hero greeting + action quad + recent analyses + ask bar."
        notes={['Four action cards (search / PDF / PICO / chat)', 'Recent analyses list', 'Floating ask bar above nav']}
        navActive="home"><ScreenHome/></PhonePage>

      <PhonePage label="09 · Analyze" num="09"
        title="Analyze."
        subtitle="Topic input + sub-field chips + filter list + big CTA."
        notes={['Live topic box with count', 'Scrollable sub-field chip row', 'Inline filter rows']}
        showNav={false}><ScreenAnalyze/></PhonePage>

      <PhonePage label="10 · Results" num="10"
        title="Streaming results."
        subtitle="Live synthesis status + gap cards appearing one by one."
        notes={['Progress card with step list', 'Gap cards with dial scores', 'Evidence quotes in serif italic']}
        showNav={false}><ScreenResults/></PhonePage>

      <PhonePage label="11 · Gap detail" num="11"
        title="Gap detail."
        subtitle="Full page for one gap — scores, suggested question, method, evidence."
        notes={['3 score tiles', 'Ink card with research question', 'Evidence panel with annotated quotes']}
        showNav={false}><ScreenDetail/></PhonePage>

      <PhonePage label="12 · Library" num="12"
        title="Library."
        subtitle="Saved analyses in a two-column grid, filtered by sub-field."
        notes={['Filter chip row', '2-col grid of compact cards', 'Field + gap count + date']}
        navActive="library"><ScreenLibrary/></PhonePage>

      <PhonePage label="13 · Paywall" num="13"
        title="Paywall."
        subtitle="Three tiers — Free (current), Pro (featured), Team."
        notes={['Pro card highlighted in butter', 'Ink CTA at the bottom', 'Restore link top-right']}
        showNav={false}><ScreenPaywall/></PhonePage>

      <SystemPage/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

// Auto-print after fonts + JSX ready
(async () => {
  try { await document.fonts.ready; } catch (e) {}
  await new Promise(r => setTimeout(r, 800));
  window.print();
})();
</script>
</body>
</html>
